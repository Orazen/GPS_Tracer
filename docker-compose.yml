# ---------------------------------------------------------------------------
# GPS_Tracer — self-hosted fleet tracking
#
# Traccar + PostgreSQL. Traccar does all the tracking work; PostgreSQL stores
# it. There is no custom backend.
#
# Ports deliberately published — only these, and all but one on loopback:
#   ${DASHBOARD_PORT}    fleet + tachograph dashboard, human traffic, behind HTTPS
#   ${TRACCAR_WEB_PORT}  Traccar's own UI, loopback only (break-glass access)
#   ${H02_PORT}          H02 tracker protocol, the tracker connects here
#   ${TACHO_API_PORT}    tachograph API, loopback only
#
# ${H02_PORT} is the port on the SERVER (the host), which is the number that
# goes into the tracker's SMS provisioning. Traccar's H02 listener itself stays
# on 5013 inside the container — see the traccar service.
#
# Traccar listens on hundreds of protocol ports by default. None of them are
# published here; exposing them is how servers end up on botnet lists. Add a port
# only when a tracker you actually own needs one.
#
# No `version:` key — it is obsolete and warns on Compose v2.
# ---------------------------------------------------------------------------

# Deliberately not the bare product name.
#
# `name:` prefixes every volume this file declares, and a generic name collides
# with any other stack on the same machine that also calls itself `gpstracer`.
# Docker does not warn about that: it hands the Postgres container whatever
# volume already has that name. Observed on this project before this was fixed —
# Postgres mounted a MySQL data directory and crash-looped with
# `chown: /var/lib/postgresql/data/mysql.sock: No such file or directory`, which
# reads like a corruption bug rather than a naming collision.
#
# A distinct default makes it impossible. `-p`/COMPOSE_PROJECT_NAME still
# overrides it, which is how a second copy on one host is kept apart — but ONLY
# because no service below sets `container_name`. A fixed container name is not
# prefixed by the project, so two copies on one host collide on the second one
# before either starts, and `-p` cannot save them. Compose's generated
# `<project>-<service>-<index>` name is unique per project by construction; use
# that, and never add `container_name` back to any service in this file.
name: gpstracer-fleet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Rome}
      # Deterministic collation regardless of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Traccar must not start until PostgreSQL actually accepts connections.
      # `pg_isready` alone is not enough: it also succeeds while the init
      # scripts are still running. Checking the target database catches that.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal
    # NOTE: deliberately no `ports:`. The database must never be reachable from
    # the internet. See docs/SECURITY.md.

  traccar:
    # Pinned. Never use :latest — an upgrade then happens silently on restart
    # and Traccar runs Liquibase migrations that you did not intend.
    image: traccar/traccar:6.16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      # Consumed by traccar/entrypoint.sh to render traccar.xml.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WEB_PORT: ${TRACCAR_WEB_PORT:-8082}
      LOG_LEVEL: ${TRACCAR_LOG_LEVEL:-info}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m}
      POSITION_RETENTION_DAYS: ${POSITION_RETENTION_DAYS:-180}
      # Address lookup for the stops and trips reports. Off by default: see the
      # header of traccar/config/entrypoint.sh for the measurements behind that.
      GEOCODER: ${GEOCODER:-off}
      GEOCODER_KEY: ${GEOCODER_KEY:-}
      # Bootstrap only. See docs/DOKPLOY.md § First run.
      ALLOW_REGISTRATION: ${TRACCAR_ALLOW_REGISTRATION:-false}
      # Auto-create a device on an unknown identifier's first packet. Off by
      # default: the H02 port is public, so with it on anything that can reach
      # the port becomes a device. Turning it on is the zero-touch onboarding
      # path -- see docs/TRACKER-SETUP.md §4 for the trade-off.
      REGISTER_UNKNOWN: ${TRACCAR_REGISTER_UNKNOWN:-false}
      # What an auto-created device looks like, and how far the allow-list reaches.
      # See the entrypoint's REGISTER_UNKNOWN block; `truck` matches this fleet.
      REGISTER_UNKNOWN_CATEGORY: ${TRACCAR_REGISTER_UNKNOWN_CATEGORY:-truck}
      REGISTER_UNKNOWN_REGEX: ${TRACCAR_REGISTER_UNKNOWN_REGEX:-}
    # Traccar 6.16 has no native environment-variable configuration (there is no
    # TRACCAR_* handling in the jar). It only reads conf/traccar.xml. So the
    # entrypoint renders that file from these variables at container start.
    #
    # The script is mounted at /opt/traccar/gpstracer/, NOT inside conf/, because
    # conf/ is overlaid by a volume and would shadow it.
    entrypoint: ["/bin/sh", "/opt/traccar/gpstracer/entrypoint.sh"]
    command:
      - -jar
      - tracker-server.jar
      - conf/traccar.xml
    volumes:
      # The rendered config. A named volume, not a bind mount: the rendered file
      # contains the database password, and this keeps it inside Docker's volume
      # directory instead of anywhere near the repository. Writable because the
      # entrypoint generates the file here.
      - traccar-conf:/opt/traccar/conf
      # Our entrypoint, read-only.
      - ./traccar/config/entrypoint.sh:/opt/traccar/gpstracer/entrypoint.sh:ro
      # Attachments, uploaded media, per-device custom assets.
      - traccar-data:/opt/traccar/data
      # Log files.
      - traccar-logs:/opt/traccar/logs
      # Branding overrides (logo, CSS, custom page). See branding/README.md.
      - ./branding/override:/opt/traccar/web/override:ro
    ports:
      # Dashboard. Bind to loopback and let Dokploy's reverse proxy terminate
      # TLS in front of it, rather than exposing 8082 to the world directly.
      - "127.0.0.1:${TRACCAR_WEB_PORT:-8082}:${TRACCAR_WEB_PORT:-8082}"
      # H02 tracker protocol. This one MUST be publicly reachable — it is how
      # the tracker in the truck reaches the server. No TLS: the protocol is a
      # plain TCP stream. Restrict with a firewall if you know your SIM's
      # provider egress ranges.
      #
      # Host side is configurable; the container side is pinned to 5013, which is
      # the port Traccar opens for h02 out of the box. Do NOT write
      # `"${H02_PORT}:${H02_PORT}"` here: H02_PORT is then used for both sides,
      # and Traccar does not read it. Point the host at any other number and the
      # published port lands on whatever protocol Traccar does listen on there.
      # 5093, for instance, is Traccar's *watch* port — the stack comes up
      # healthy, accepts the tracker's connection, and silently decodes nothing.
      - "${H02_PORT:-5013}:5013"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${TRACCAR_WEB_PORT:-8082}/api/server >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: the first boot runs every Liquibase migration and can take a
      # while on a small VPS.
      start_period: 180s
    networks:
      - internal

  # -------------------------------------------------------------------------
  # Dashboard (Phase 2).
  #
  # The one place a human signs in. It serves the React app and proxies two
  # upstreams from the same origin:
  #
  #   /api/*    -> Traccar, so the JSESSIONID cookie stays same-origin and no
  #                CORS configuration is needed
  #   /tacho/*  -> the tachograph API, with the SERVICE TOKEN injected server-side
  #
  # That second bullet is the reason this service exists. The tachograph API
  # serves driver personal data behind a service token; if the browser called it
  # directly it would have to hold that token, which is the same as publishing it.
  # Here the token never leaves this container, and the identity of the human is
  # forwarded to the tachograph service, which records it in its audit log — so
  # there is one login, not two. See dashboard/server.mjs.
  # -------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
    image: gpstracer-dashboard:local
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      DASHBOARD_PORT: 8083
      # Internal network names, not the published host ports.
      TRACCAR_INTERNAL_URL: http://traccar:${TRACCAR_WEB_PORT:-8082}
      TACHO_INTERNAL_URL: http://tacho-api:8084
      TACHO_API_TOKEN: ${TACHO_API_TOKEN:?set TACHO_API_TOKEN - see .env.example}
      # Scrap service. Optional here on purpose: without the token the /scrap
      # proxy answers 503 and the rest of the dashboard still starts. Making it
      # required would stop an existing deployment from coming up on upgrade.
      SCRAP_INTERNAL_URL: http://scrap-api:8085
      SCRAP_API_TOKEN: ${SCRAP_API_TOKEN:-}
      # Role for a signed-in non-admin user. Read-only unless deliberately changed.
      SCRAP_DEFAULT_ROLE: ${SCRAP_DEFAULT_ROLE:-viewer}
      DASHBOARD_MAX_BODY_BYTES: ${DASHBOARD_MAX_BODY_BYTES:-16777216}
      # The "Connect a tracker" screen prints the host port the tracker must be
      # pointed at, which is this one -- the published side of the H02 mapping,
      # not the container's 5013. Getting those two the wrong way round is
      # UNIMPLEMENTED.md 7.8.
      H02_PORT: ${H02_PORT:-5013}
      TRACCAR_LOG_DIR: /opt/traccar/logs
    volumes:
      # Read-only, and only the logs.
      #
      # The dashboard needs two facts it cannot get over the API: the onboarding
      # settings the Traccar container rendered (traccar/config/entrypoint.sh
      # writes onboarding.json here) and the identifiers Traccar has REFUSED,
      # which exist only as `WARN: Unknown device - <id>` lines in tracker-server.log.
      #
      # conf/ is deliberately NOT mounted. It holds the same file the container
      # renders -- with the PostgreSQL password in it. Reading that to display a
      # boolean would widen access to the database for no gain.
      - traccar-logs:/opt/traccar/logs:ro
    ports:
      # Loopback. Dokploy's proxy terminates TLS in front of it; see docs/DOKPLOY.md.
      - "127.0.0.1:${DASHBOARD_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # -------------------------------------------------------------------------
  # Tachograph service (Phase 3-5).
  #
  # Two containers from one image, deliberately: the API accepts uploads, the
  # worker parses them. The specification requires parsing to be kept out of the
  # web request process, and separate processes are the honest way to do that —
  # a parser bug, a hang, or an OOM cannot then take the API down with it.
  #
  # They share the same PostgreSQL instance as Traccar and keep their tables in
  # the tacho_ namespace, so there is no second database to back up, monitor or
  # size. See docs/TACHO-SERVICE.md.
  # -------------------------------------------------------------------------
  tacho-api:
    build:
      context: ./tacho
    image: gpstracer-tacho:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      TACHO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TACHO_API_TOKEN: ${TACHO_API_TOKEN:?set TACHO_API_TOKEN - see .env.example}
      TACHO_STORAGE_DIR: /var/lib/gpstracer/tacho
      TACHO_ALLOWED_ORIGINS: ${TACHO_ALLOWED_ORIGINS:-http://127.0.0.1:8083}
      TACHO_MAX_UPLOAD_BYTES: ${TACHO_MAX_UPLOAD_BYTES:-8388608}
      TACHO_LOG_LEVEL: ${TRACCAR_LOG_LEVEL:-info}
    volumes:
      # Uploaded driver cards. A named volume, never a bind mount into the
      # repository: these are personal data and must not sit next to the source.
      - tacho-data:/var/lib/gpstracer/tacho
    ports:
      # Loopback only. This API serves driver personal data; the dashboard reaches
      # it over the internal network, and nothing outside the host should.
      - "127.0.0.1:${TACHO_API_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8084/healthz',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

  tacho-worker:
    build:
      context: ./tacho
    image: gpstracer-tacho:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      TACHO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The worker never receives a request, so it does not need the API token to
      # serve anyone — but the shared configuration validation requires one, and
      # having a token it never uses is better than a code path that skips the
      # check when no token is present.
      TACHO_API_TOKEN: ${TACHO_API_TOKEN:?set TACHO_API_TOKEN - see .env.example}
      TACHO_STORAGE_DIR: /var/lib/gpstracer/tacho
      TACHO_WORKER_POLL_SECONDS: ${TACHO_WORKER_POLL_SECONDS:-3}
      TACHO_WORKER_LEASE_MINUTES: ${TACHO_WORKER_LEASE_MINUTES:-15}
      TACHO_WORKER_MAX_ATTEMPTS: ${TACHO_WORKER_MAX_ATTEMPTS:-3}
      # Optional: an external parser for vehicle-unit downloads and GEN2 files.
      # Leave empty to run the clean-room GEN1 person-card parser only.
      TACHO_EXTERNAL_PARSER: ${TACHO_EXTERNAL_PARSER:-}
      TACHO_LOG_LEVEL: ${TRACCAR_LOG_LEVEL:-info}
    command: ["python", "-m", "tacho.worker"]
    volumes:
      - tacho-data:/var/lib/gpstracer/tacho
    # No ports at all. The worker makes outbound database connections and nothing
    # else; it must never be reachable.
    networks:
      - internal

  # -------------------------------------------------------------------------
  # Scrap-metal fleet and inventory service (loopback only).
  #
  # Owns loads, weigh tickets, stock movements and the audit trail. Like the
  # tachograph service it keeps its tables in the scrap_ namespace of the same
  # PostgreSQL instance. See scrap/README.md (forthcoming).
  # -------------------------------------------------------------------------
  scrap-api:
    build:
      context: ./scrap
    image: gpstracer-scrap:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      SCRAP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SCRAP_API_TOKEN: ${SCRAP_API_TOKEN:?set SCRAP_API_TOKEN - see .env.example}
      SCRAP_STORAGE_DIR: /var/lib/gpstracer/scrap
      SCRAP_ALLOWED_ORIGINS: ${SCRAP_ALLOWED_ORIGINS:-http://127.0.0.1:8083}
      SCRAP_LOG_LEVEL: ${TRACCAR_LOG_LEVEL:-info}
    volumes:
      - scrap-data:/var/lib/gpstracer/scrap
    ports:
      - "127.0.0.1:${SCRAP_API_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8085/healthz',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # -------------------------------------------------------------------------
  # Fleet simulator (optional, profile "tools").
  #
  # Seeds a demonstration fleet through the REAL H02 protocol on 5013, so
  # Traccar's own decoder parses it and positions arrive through the production
  # code path. It proves the protocol listener and everything downstream of a
  # stored position; it does NOT prove the radio link, SIM, GNSS or the device's
  # firmware. See docs/UNIMPLEMENTED.md.
  #
  #   docker compose --profile tools run --rm simulator
  #   docker compose --profile tools run --rm simulator --city rome --vehicles 4
  #
  # It runs on the internal network rather than from the host on purpose. The H02
  # listener is only published to the host for the tracker itself; a simulator
  # has no business using that path, and reaching Traccar over the stack's own
  # network is what the API and the worker already do.
  # -------------------------------------------------------------------------
  simulator:
    image: python:3.12-slim
    profiles: ["tools"]
    depends_on:
      traccar:
        condition: service_healthy
    environment:
      # Host names on the internal network, not the published host ports.
      SIMULATOR_API: http://traccar:${TRACCAR_WEB_PORT:-8082}
      H02_HOST: traccar
      # The container-side port, not the published one, because this runs on the
      # internal network next to Traccar.
      H02_PORT: 5013
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL - see .env.example}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD - see .env.example}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["python", "/scripts/simulate-fleet.py"]
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db-data:
  traccar-data:
  traccar-logs:
  # Rendered config lives in a named volume, not the repo.
  traccar-conf:
  # Uploaded tachograph files. Content-addressed inside; see tacho/README.md.
  # NOTE: this volume and the tacho_ tables must be backed up together, or an
  # import will reference a file that is no longer there.
  tacho-data:
  # Scrap service data (QR images etc.).
  scrap-data:
