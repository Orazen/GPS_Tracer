[project]
name = "gpstracer-scrap"
version = "0.1.0"
description = "Scrap-metal fleet and inventory service for GPS_Tracer"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: requires a live PostgreSQL (SCRAP_TEST_DATABASE_URL)",
]

[tool.setuptools.packages.find]
include = ["scrap*"]