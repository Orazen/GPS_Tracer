[project]
name = "gpstracer-tacho"
version = "0.1.0"
description = "Tachograph (.DDD) import, activity normalisation and driving-time reporting for GPS_Tracer"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must not reach the network or a real database. Anything that needs
# PostgreSQL is marked and skipped unless TACHO_TEST_DATABASE_URL is set.
addopts = "-q"
markers = [
    "db: requires a live PostgreSQL (TACHO_TEST_DATABASE_URL)",
]

[tool.setuptools.packages.find]
include = ["tacho*"]
